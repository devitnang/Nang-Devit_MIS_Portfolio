<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080F1E"/>
      <stop offset="100%" stop-color="#0F1E36"/>
    </linearGradient>
    <filter id="shadow2" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#bgGrad2)"/>

  <!-- Title Banner -->
  <rect x="50" y="30" width="1100" height="70" rx="10" fill="#0E1E38" stroke="#1E3A8A" stroke-width="1.5"/>
  <text x="80" y="65" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="20" font-weight="bold">LIBRARY MANAGEMENT SYSTEM — ENTITY RELATIONSHIP DIAGRAM (ERD)</text>
  <text x="80" y="85" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">3NF Normalized Relational Schema Architecture · db_library.sql</text>

  <!-- TABLE: MEMBER -->
  <g transform="translate(60, 130)" filter="url(#shadow2)">
    <rect width="220" height="200" rx="8" fill="#0D1B33" stroke="#1E3A8A" stroke-width="1.5"/>
    <rect width="220" height="34" rx="8" fill="#1E3A8A"/>
    <text x="15" y="22" fill="#FFFFFF" font-family="monospace" font-size="13" font-weight="bold">MEMBER</text>
    <text x="15" y="55" fill="#38BDF8" font-family="monospace" font-size="11">PK member_id: INT</text>
    <text x="15" y="75" fill="#E2E8F0" font-family="monospace" font-size="11">   first_name: VARCHAR</text>
    <text x="15" y="95" fill="#E2E8F0" font-family="monospace" font-size="11">   last_name: VARCHAR</text>
    <text x="15" y="115" fill="#E2E8F0" font-family="monospace" font-size="11">   email: VARCHAR</text>
    <text x="15" y="135" fill="#E2E8F0" font-family="monospace" font-size="11">   phone: VARCHAR</text>
    <text x="15" y="155" fill="#E2E8F0" font-family="monospace" font-size="11">   address: TEXT</text>
    <text x="15" y="175" fill="#E2E8F0" font-family="monospace" font-size="11">   membership_date: DATE</text>
  </g>

  <!-- TABLE: TRANSACTION -->
  <g transform="translate(340, 130)" filter="url(#shadow2)">
    <rect width="240" height="220" rx="8" fill="#0D1B33" stroke="#1E3A8A" stroke-width="1.5"/>
    <rect width="240" height="34" rx="8" fill="#0B2046"/>
    <text x="15" y="22" fill="#60A5FA" font-family="monospace" font-size="13" font-weight="bold">TRANSACTION</text>
    <text x="15" y="55" fill="#38BDF8" font-family="monospace" font-size="11">PK transaction_id: INT</text>
    <text x="15" y="75" fill="#A78BFA" font-family="monospace" font-size="11">FK member_id: INT</text>
    <text x="15" y="95" fill="#A78BFA" font-family="monospace" font-size="11">FK book_id: INT</text>
    <text x="15" y="115" fill="#A78BFA" font-family="monospace" font-size="11">FK staff_id: INT</text>
    <text x="15" y="135" fill="#E2E8F0" font-family="monospace" font-size="11">   borrow_date: DATE</text>
    <text x="15" y="155" fill="#E2E8F0" font-family="monospace" font-size="11">   due_date: DATE</text>
    <text x="15" y="175" fill="#E2E8F0" font-family="monospace" font-size="11">   return_date: DATE</text>
    <text x="15" y="195" fill="#34D399" font-family="monospace" font-size="11">   status: VARCHAR</text>
  </g>

  <!-- TABLE: FINE -->
  <g transform="translate(340, 400)" filter="url(#shadow2)">
    <rect width="240" height="160" rx="8" fill="#0D1B33" stroke="#1E3A8A" stroke-width="1.5"/>
    <rect width="240" height="34" rx="8" fill="#1E3A8A"/>
    <text x="15" y="22" fill="#FFFFFF" font-family="monospace" font-size="13" font-weight="bold">FINE</text>
    <text x="15" y="55" fill="#38BDF8" font-family="monospace" font-size="11">PK fine_id: INT</text>
    <text x="15" y="75" fill="#A78BFA" font-family="monospace" font-size="11">FK transaction_id: INT</text>
    <text x="15" y="95" fill="#E2E8F0" font-family="monospace" font-size="11">   amount: DECIMAL(10,2)</text>
    <text x="15" y="115" fill="#E2E8F0" font-family="monospace" font-size="11">   payment_status: VARCHAR</text>
    <text x="15" y="135" fill="#E2E8F0" font-family="monospace" font-size="11">   paid_date: DATE</text>
  </g>

  <!-- TABLE: BOOK -->
  <g transform="translate(640, 130)" filter="url(#shadow2)">
    <rect width="250" height="260" rx="8" fill="#0D1B33" stroke="#1E3A8A" stroke-width="1.5"/>
    <rect width="250" height="34" rx="8" fill="#0B2046"/>
    <text x="15" y="22" fill="#60A5FA" font-family="monospace" font-size="13" font-weight="bold">BOOK</text>
    <text x="15" y="55" fill="#38BDF8" font-family="monospace" font-size="11">PK book_id: INT</text>
    <text x="15" y="75" fill="#E2E8F0" font-family="monospace" font-size="11">   title: VARCHAR(255)</text>
    <text x="15" y="95" fill="#E2E8F0" font-family="monospace" font-size="11">   isbn: VARCHAR(20)</text>
    <text x="15" y="115" fill="#A78BFA" font-family="monospace" font-size="11">FK author_id: INT</text>
    <text x="15" y="135" fill="#A78BFA" font-family="monospace" font-size="11">FK publisher_id: INT</text>
    <text x="15" y="155" fill="#A78BFA" font-family="monospace" font-size="11">FK category_id: INT</text>
    <text x="15" y="175" fill="#A78BFA" font-family="monospace" font-size="11">FK supplier_id: INT</text>
    <text x="15" y="195" fill="#E2E8F0" font-family="monospace" font-size="11">   published_year: INT</text>
    <text x="15" y="215" fill="#E2E8F0" font-family="monospace" font-size="11">   total_copies: INT</text>
    <text x="15" y="235" fill="#34D399" font-family="monospace" font-size="11">   available_copies: INT</text>
  </g>

  <!-- TABLE: AUTHOR -->
  <g transform="translate(940, 130)" filter="url(#shadow2)">
    <rect width="200" height="150" rx="8" fill="#0D1B33" stroke="#1E3A8A" stroke-width="1.5"/>
    <rect width="200" height="34" rx="8" fill="#1E3A8A"/>
    <text x="15" y="22" fill="#FFFFFF" font-family="monospace" font-size="13" font-weight="bold">AUTHOR</text>
    <text x="15" y="55" fill="#38BDF8" font-family="monospace" font-size="11">PK author_id: INT</text>
    <text x="15" y="75" fill="#E2E8F0" font-family="monospace" font-size="11">   first_name: VARCHAR</text>
    <text x="15" y="95" fill="#E2E8F0" font-family="monospace" font-size="11">   last_name: VARCHAR</text>
    <text x="15" y="115" fill="#E2E8F0" font-family="monospace" font-size="11">   biography: TEXT</text>
  </g>

  <!-- TABLE: CATEGORY -->
  <g transform="translate(940, 310)" filter="url(#shadow2)">
    <rect width="200" height="130" rx="8" fill="#0D1B33" stroke="#1E3A8A" stroke-width="1.5"/>
    <rect width="200" height="34" rx="8" fill="#1E3A8A"/>
    <text x="15" y="22" fill="#FFFFFF" font-family="monospace" font-size="13" font-weight="bold">CATEGORY</text>
    <text x="15" y="55" fill="#38BDF8" font-family="monospace" font-size="11">PK category_id: INT</text>
    <text x="15" y="75" fill="#E2E8F0" font-family="monospace" font-size="11">   category_name: VARCHAR</text>
    <text x="15" y="95" fill="#E2E8F0" font-family="monospace" font-size="11">   description: TEXT</text>
  </g>

  <!-- TABLE: STAFF -->
  <g transform="translate(60, 400)" filter="url(#shadow2)">
    <rect width="220" height="180" rx="8" fill="#0D1B33" stroke="#1E3A8A" stroke-width="1.5"/>
    <rect width="220" height="34" rx="8" fill="#1E3A8A"/>
    <text x="15" y="22" fill="#FFFFFF" font-family="monospace" font-size="13" font-weight="bold">STAFF</text>
    <text x="15" y="55" fill="#38BDF8" font-family="monospace" font-size="11">PK staff_id: INT</text>
    <text x="15" y="75" fill="#E2E8F0" font-family="monospace" font-size="11">   first_name: VARCHAR</text>
    <text x="15" y="95" fill="#E2E8F0" font-family="monospace" font-size="11">   last_name: VARCHAR</text>
    <text x="15" y="115" fill="#E2E8F0" font-family="monospace" font-size="11">   email: VARCHAR</text>
    <text x="15" y="135" fill="#E2E8F0" font-family="monospace" font-size="11">   role: VARCHAR</text>
    <text x="15" y="155" fill="#E2E8F0" font-family="monospace" font-size="11">   status: VARCHAR</text>
  </g>

  <!-- TABLE: RESERVATION -->
  <g transform="translate(640, 440)" filter="url(#shadow2)">
    <rect width="250" height="160" rx="8" fill="#0D1B33" stroke="#1E3A8A" stroke-width="1.5"/>
    <rect width="250" height="34" rx="8" fill="#1E3A8A"/>
    <text x="15" y="22" fill="#FFFFFF" font-family="monospace" font-size="13" font-weight="bold">RESERVATION</text>
    <text x="15" y="55" fill="#38BDF8" font-family="monospace" font-size="11">PK reservation_id: INT</text>
    <text x="15" y="75" fill="#A78BFA" font-family="monospace" font-size="11">FK member_id: INT</text>
    <text x="15" y="95" fill="#A78BFA" font-family="monospace" font-size="11">FK book_id: INT</text>
    <text x="15" y="115" fill="#E2E8F0" font-family="monospace" font-size="11">   reservation_date: DATE</text>
    <text x="15" y="135" fill="#E2E8F0" font-family="monospace" font-size="11">   status: VARCHAR</text>
  </g>

  <!-- Relationship Lines -->
  <g stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="4,3" fill="none">
    <!-- MEMBER to TRANSACTION -->
    <path d="M 280 200 L 340 200"/>
    <!-- TRANSACTION to BOOK -->
    <path d="M 580 200 L 640 200"/>
    <!-- TRANSACTION to FINE -->
    <path d="M 460 350 L 460 400"/>
    <!-- BOOK to AUTHOR -->
    <path d="M 890 180 L 940 180"/>
    <!-- BOOK to CATEGORY -->
    <path d="M 890 260 L 940 340"/>
    <!-- STAFF to TRANSACTION -->
    <path d="M 280 460 L 340 280"/>
  </g>
</svg>
