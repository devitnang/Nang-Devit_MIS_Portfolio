<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <linearGradient id="browserBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#070C1D"/>
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <filter id="winShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="750" fill="#030712"/>

  <!-- Browser Window Container -->
  <g transform="translate(50, 40)" filter="url(#winShadow)">
    <rect width="1100" height="670" rx="12" fill="url(#browserBg)" stroke="#1F2937" stroke-width="1.5"/>

    <!-- Browser Window Titlebar -->
    <rect width="1100" height="42" rx="12" fill="#111827"/>
    <rect y="30" width="1100" height="12" fill="#111827"/>
    <line x1="0" y1="42" x2="1100" y2="42" stroke="#1F2937" stroke-width="1"/>

    <!-- Window controls -->
    <circle cx="25" cy="21" r="6" fill="#EF4444"/>
    <circle cx="45" cy="21" r="6" fill="#F59E0B"/>
    <circle cx="65" cy="21" r="6" fill="#10B981"/>

    <!-- URL Bar -->
    <rect x="220" y="8" width="660" height="26" rx="6" fill="#1F2937" stroke="#374151" stroke-width="1"/>
    <!-- Lock icon -->
    <svg x="232" y="14" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#10B981" stroke-width="2.5">
      <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
      <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
    </svg>
    <text x="255" y="26" fill="#E5E7EB" font-family="monospace" font-size="12">https://portfolio.sokraingseyken.xyz</text>

    <!-- Navigation Header inside site -->
    <g transform="translate(0, 42)">
      <rect width="1100" height="60" fill="#0B132B" opacity="0.8"/>
      <line x1="0" y1="60" x2="1100" y2="60" stroke="#1F2937" stroke-width="1"/>

      <text x="60" y="38" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="18" font-weight="bold">SOKRAINGSEY<tspan fill="#3B82F6">.KEN</tspan></text>

      <text x="760" y="36" fill="#9CA3AF" font-family="system-ui, sans-serif" font-size="13">About</text>
      <text x="830" y="36" fill="#9CA3AF" font-family="system-ui, sans-serif" font-size="13">Skills</text>
      <text x="895" y="36" fill="#9CA3AF" font-family="system-ui, sans-serif" font-size="13">Projects</text>
      <rect x="970" y="18" width="80" height="26" rx="6" fill="#3B82F6"/>
      <text x="1010" y="35" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Contact</text>
    </g>

    <!-- Hero Content -->
    <g transform="translate(60, 140)">
      <!-- Badge -->
      <rect width="180" height="26" rx="13" fill="#1E293B" stroke="#3B82F6" stroke-width="1"/>
      <circle cx="15" cy="13" r="4" fill="#10B981"/>
      <text x="28" y="17" fill="#60A5FA" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">AVAILABLE FOR WORK</text>

      <!-- Headings -->
      <text x="0" y="70" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="34" font-weight="800">Ken Sokraingsey</text>
      <text x="0" y="105" fill="#60A5FA" font-family="system-ui, sans-serif" font-size="20" font-weight="600">IT Support &amp; Systems Specialist</text>

      <text x="0" y="140" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="14" width="500">
        <tspan x="0" dy="0">Specializing in IT infrastructure, system analysis, network troubleshooting,</tspan>
        <tspan x="0" dy="22">and enterprise web development with Next.js, TypeScript, and modern frameworks.</tspan>
      </text>

      <!-- CTA Buttons -->
      <g transform="translate(0, 185)">
        <rect width="130" height="38" rx="8" fill="#3B82F6"/>
        <text x="65" y="24" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">View Projects</text>

        <rect x="145" width="130" height="38" rx="8" fill="#1E293B" stroke="#374151" stroke-width="1"/>
        <text x="210" y="24" fill="#E5E7EB" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Contact Me</text>
      </g>
    </g>

    <!-- Right Side Hero Cards / Mock Visual -->
    <g transform="translate(650, 140)">
      <rect width="400" height="230" rx="12" fill="#13233F" stroke="#1E3A8A" stroke-width="1.5"/>
      <rect width="400" height="36" rx="12" fill="#0F244A"/>
      <text x="20" y="24" fill="#60A5FA" font-family="monospace" font-size="12" font-weight="bold">Core Competencies</text>

      <g transform="translate(20, 55)">
        <rect width="170" height="65" rx="8" fill="#0B132B" stroke="#1E293B" stroke-width="1"/>
        <text x="15" y="28" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">IT Infrastructure</text>
        <text x="15" y="48" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">Hardware &amp; System Maintenance</text>

        <rect x="190" width="170" height="65" rx="8" fill="#0B132B" stroke="#1E293B" stroke-width="1"/>
        <text x="205" y="28" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">Network Systems</text>
        <text x="205" y="48" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">Routing, Switching &amp; TCP/IP</text>

        <rect y="80" width="170" height="65" rx="8" fill="#0B132B" stroke="#1E293B" stroke-width="1"/>
        <text x="15" y="108" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">Next.js &amp; React</text>
        <text x="15" y="128" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">Modern App Router Web</text>

        <rect x="190" y="80" width="170" height="65" rx="8" fill="#0B132B" stroke="#1E293B" stroke-width="1"/>
        <text x="205" y="108" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">Database &amp; SQL</text>
        <text x="205" y="128" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">Relational Modeling &amp; Queries</text>
      </g>
    </g>

    <!-- Bottom Tech Stack strip -->
    <g transform="translate(60, 420)">
      <rect width="980" height="180" rx="12" fill="#0E1A33" stroke="#1E293B" stroke-width="1"/>
      <text x="30" y="35" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" letter-spacing="1">FEATURED TECHNOLOGIES &amp; FRAMEWORKS</text>

      <g transform="translate(30, 60)">
        <!-- Tech Badges -->
        <rect width="135" height="42" rx="8" fill="#13233F" stroke="#3B82F6" stroke-width="1"/>
        <text x="67" y="26" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Next.js 16</text>

        <rect x="150" width="135" height="42" rx="8" fill="#13233F" stroke="#1E293B" stroke-width="1"/>
        <text x="217" y="26" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">TypeScript</text>

        <rect x="300" width="135" height="42" rx="8" fill="#13233F" stroke="#1E293B" stroke-width="1"/>
        <text x="367" y="26" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Tailwind CSS</text>

        <rect x="450" width="145" height="42" rx="8" fill="#13233F" stroke="#1E293B" stroke-width="1"/>
        <text x="522" y="26" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Framer Motion</text>

        <rect x="610" width="145" height="42" rx="8" fill="#13233F" stroke="#1E293B" stroke-width="1"/>
        <text x="682" y="26" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Lenis Scroll</text>

        <rect x="770" width="145" height="42" rx="8" fill="#13233F" stroke="#1E293B" stroke-width="1"/>
        <text x="842" y="26" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Vercel Edge</text>
      </g>

      <text x="30" y="145" fill="#60A5FA" font-family="monospace" font-size="12">Production Deployment: Vercel CDN · SSL Active · Domain: portfolio.sokraingseyken.xyz</text>
    </g>
  </g>
</svg>